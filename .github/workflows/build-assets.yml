name: Build Assets

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow coremltools

      - name: Clone WebEyeTrack
        working-directory: Tools/Conversion
        run: |
          git clone --depth=1 https://github.com/RedForestAI/WebEyeTrack.git WebEyeTrack-upstream

      - name: Convert BlazeGaze model
        working-directory: Tools/Conversion
        run: python convert_blazegaze.py

      - name: Compile CoreML model
        run: |
          xcrun coremlc compile Sources/MacGaze/Gaze/blazegaze.mlpackage Sources/MacGaze/Gaze

      - name: Package assets
        run: |
          cd Sources/MacGaze/Gaze
          zip -r /tmp/blazegaze.mlmodelc.zip blazegaze.mlmodelc

      - name: Upload BlazeGaze model
        uses: actions/upload-artifact@v4
        with:
          name: blazegaze.mlmodelc
          path: /tmp/blazegaze.mlmodelc.zip
          retention-days: 90

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/blazegaze.mlmodelc.zip
          generate_release_notes: true
